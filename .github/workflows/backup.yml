name: Tems Fashion Supabase Backup

on:
  workflow_dispatch:

  schedule:
    - cron: '30 18 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup directory
        run: mkdir -p backups

      - name: Backup roles
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backups/roles.sql \
            --role-only

      - name: Backup schema
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backups/schema.sql

      - name: Backup data
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backups/data.sql \
            --data-only \
            --use-copy

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: tems-fashion-supabase-backup
          path: backups/
          retention-days: 30
      - name: Upload backup to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
        run: |
          python -m pip install --quiet google-api-python-client google-auth

          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive"]
          )

          drive = build("drive", "v3", credentials=credentials)

          folder_id = os.environ["GOOGLE_DRIVE_BACKUP_FOLDER_ID"]

          for filename in ["roles.sql", "schema.sql", "data.sql"]:
              path = f"backups/{filename}"

              metadata = {
                  "name": filename,
                  "parents": [folder_id]
              }

              media = MediaFileUpload(
                  path,
                  mimetype="application/sql",
                  resumable=True
              )

              result = drive.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name"
              ).execute()

              print(f"Uploaded {result['name']} - {result['id']}")
          PY
    
