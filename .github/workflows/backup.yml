name: Tems Fashion Supabase Backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Check database connection type
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ.get("SUPABASE_DB_URL", "")
          p = urlparse(url)

          print("Database host:", p.hostname)
          print("Database port:", p.port)
          print("Pooler:", "pooler.supabase.com" in (p.hostname or ""))
          print("Password present:", bool(p.password))
          PY

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup directory
        run: mkdir -p backups

      - name: Backup roles
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backups/roles.sql \
            --role-only

      - name: Backup schema
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backups/schema.sql

      - name: Backup data
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backups/data.sql \
            --data-only \
            --use-copy

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: tems-fashion-supabase-backup
          path: backups/
          retention-days: 30
