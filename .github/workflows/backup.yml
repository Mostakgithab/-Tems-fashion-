name: Tems Fashion Supabase Backup

on:
  workflow_dispatch:

  schedule:
    - cron: '30 18 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup directory
        run: mkdir -p backups

      - name: Backup roles
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backups/roles.sql \
            --role-only

      - name: Backup schema
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backups/schema.sql

      - name: Backup data
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backups/data.sql \
            --data-only \
            

      - name: Upload backup to GitHub Cloud
        uses: actions/upload-artifact@v4
        with:
          name: tems-fashion-supabase-backup
          path: backups/
          retention-days: 30
          - name: Upload backup to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python -m pip install --quiet boto3

          python - <<'PY'
          import os
          import boto3

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto"
          )

          bucket = "supabase-tems-fashion-back-up"

          for filename in ["roles.sql", "schema.sql", "data.sql"]:
              path = f"backups/{filename}"

              s3.upload_file(
                  path,
                  bucket,
                  filename
              )

              print(f"Uploaded to R2: {filename}")
          PY
