name: Cancel Expired Unpaid Orders

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cancellation Edge Function
        run: |
          curl -sf -X POST "https://xkjupbpxfikkcvcvkofo.supabase.co/functions/v1/cancel-expired-orders" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json"
